version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor and patch updates arrive together in one PR. Each major update gets its own PR,
    # labelled "major update" by .github/workflows/dependabot.yml: those can break things.
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Vitest is pinned to 4.1.x: @cloudflare/vitest-plugin requires ^4.1
      # and @vitest/coverage-istanbul pins its peer exactly (see CLAUDE.md).
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TS < 6.1 only (TS 7 is the Go rewrite), so even the
      # 6.1 minor must wait for typescript-eslint.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # ua-parser-js v2 is AGPL — prohibited (MIT v1 line only).
      - dependency-name: "ua-parser-js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns:
          - "*"
