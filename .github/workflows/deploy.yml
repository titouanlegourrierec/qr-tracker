name: Deploy

on:
  push:
    branches: [main]
  # Manual re-run (e.g. after setting the VITE_* repo variables post-first-deploy).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Deploy only after the same checks as CI, end-to-end tests included. CI runs on pull
  # requests only; on main this workflow is the gate.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: End-to-end tests (local worker + built SPA)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-worker:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: d1 migrations apply qr-tracker-db --remote
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          # The commit SHA identifies each version in `wrangler deployments list` (rollback).
          command: deploy --message ${{ github.sha }}

  deploy-pages:
    needs: deploy-worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter @qr-tracker/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  # Fails the run if production does not answer as expected after a deploy.
  smoke-test:
    needs: deploy-pages
    if: ${{ vars.VITE_API_URL != '' }}
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.VITE_API_URL }}
      SITE_URL: ${{ needs.deploy-pages.outputs.page_url }}
    steps:
      - name: Worker health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$API_URL/api/health"
      - name: Unknown QR code gets the 404 page
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' "$API_URL/r/zzzzzzz")
          echo "HTTP $code"
          test "$code" = "404"
      - name: Web app is served and wired to the worker
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors "$SITE_URL" \
            | grep --quiet --fixed-strings "$API_URL"
